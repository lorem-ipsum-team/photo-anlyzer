[project]
name = "photo-anlyzer"
version = "0.1.0"
description = "Service to analyze photos"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5.5",
    "aiohttp>=3.11.18",
    "alembic>=1.15.2",
    "asyncpg>=0.30.0",
    "facenet-pytorch>=2.5.3",
    "pillow>=11.2.1",
    "pydantic>=2.11.3",
    "python-dotenv>=1.1.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "tensorflow>=2.16.0; sys_platform != 'darwin'",
    "tensorflow-macos>=2.16.0; sys_platform == 'darwin'",
    "tensorflow-hub>=0.16.1",
    "scikit-learn>=1.6.1",
    "tensorflow_text==2.16.1; sys_platform != 'darwin'",
    "tensorflow_text @ https://github.com/sun1638650145/Libraries-and-Extensions-for-TensorFlow-for-Apple-Silicon/releases/download/v2.16/tensorflow_text-2.16.1-cp311-cp311-macosx_11_0_arm64.whl ; sys_platform == 'darwin'",
    "pgvector>=0.4.1",
    "geoalchemy2>=0.17.1",
    "fasttext>=0.9.3",
]
